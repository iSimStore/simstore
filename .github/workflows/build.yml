name: Build SimStore

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch tags
        # The pushed tag may be absent after checkout even with fetch-depth: 0.
        run: git fetch --tags --force
      - name: Install SVG renderer
        run: brew install librsvg
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Check Python lint
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m ruff check scripts tests
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Package
        run: |
          release_tag=latest
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          python3 scripts/release.py package --app build/release/SimStore.app --tag "$release_tag"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SimStore.app.tar.bz2
          path: build/SimStore.app.tar.bz2
          archive: false
          if-no-files-found: error
      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release.json
          path: build/release.json
          archive: false
          if-no-files-found: error
      - name: Check Swift formatting
        run: xcrun swift-format lint --recursive --strict src tests
      - name: Check catalog categories
        run: cmake --build --preset release --target CheckCatalogCategories
      - name: Check localization catalog
        run: |
          cmake --build --preset release --target GenerateStrings
          git diff --exit-code -- assets/Localizable.xcstrings
      - name: Test
        run: ctest --preset release --verbose
      - name: Test Debug previews
        run: |
          cmake --preset debug
          cmake --build --preset debug --target SimStore SimStorePreviewScenarioTest
          ctest --preset debug --verbose -L '^preview-scenarios$'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            build/release/test-results.xml
            build/debug/test-results.xml
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: simstore-releases
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SimStore.app.tar.bz2
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release.json
          path: build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish --repo "$GH_REPO"
